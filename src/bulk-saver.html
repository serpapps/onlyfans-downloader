<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OnlyFans Bulk Saver</title>
    <style>
      body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:#0e1424;color:#f1f5ff;margin:0;padding:16px}
      .card{background:#090f1b;border:1px solid #1c2a40;border-radius:8px;padding:16px;max-width:560px;margin:0 auto}
      h1{font-size:18px;margin:0 0 8px}
      p{margin:6px 0;color:#9ab3db}
      button{background:#00AFF0;border:none;color:#0b1529;font-weight:700;padding:10px 14px;border-radius:6px;cursor:pointer}
      button:hover{filter:brightness(1.05)}
      .row{display:flex;gap:10px;align-items:center;margin-top:10px}
      .status{margin-top:10px;font-size:12px;color:#9ab3db}
      .ok{color:#32d19d}
      .warn{color:#ffd166}
      .err{color:#ff5c5c}
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Bulk Saver</h1>
      <p>Choose a folder once. We will save all files there without further prompts.</p>
      <div class="row">
        <button id="chooseBtn">Choose Folder…</button>
        <span id="dirStatus" class="status">No folder selected</span>
      </div>
      <p id="hint" class="status">Keep this window open while bulk downloads run.</p>
      <div id="saveLog" class="status"></div>
    </div>
    <script type="module" src="bulk-saver.js"></script>
  </body>
  </html>
